name: Fighter identity audit

on:
  pull_request:
    paths:
      - "identity_audit.py"
      - "tests/test_identity_audit.py"
      - ".github/workflows/fighter-identity-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download historical UFC data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 --output data/ufc_all_fights_wide.csv \
            https://raw.githubusercontent.com/nlbair/ufc-data/main/data/ufc_all_fights_wide.csv
      - name: Audit fighter identities before November 7 2026
        run: python identity_audit.py --before 2026-11-07
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: fighter-identity-audit
          path: results/fighter_identity_audit.json
