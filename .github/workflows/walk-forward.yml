name: Walk-forward UFC evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/walk-forward.yml"
      - "walk_forward.py"
      - "engine.py"
      - "calibration.py"
      - "selective_evaluation.py"
      - "market_blend.py"
      - "requirements.txt"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python tests
        run: python -m unittest discover -s tests -v
      - name: Download historical UFC bout data
        run: |
          mkdir -p data
          curl -fsSL --retry 2 -o data/ufc_all_fights_wide.csv https://raw.githubusercontent.com/nlbair/ufc-data/main/data/ufc_all_fights_wide.csv
      - name: Run year-by-year evaluation 2018-2026
        run: python walk_forward.py --start-year 2018 --end-year 2026
      - name: Save research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufc-walk-forward-research
          path: results/walk_forward.json
          if-no-files-found: warn
          retention-days: 30
