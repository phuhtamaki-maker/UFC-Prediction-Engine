name: Score frozen UFC Nov 7 picks
on:
  workflow_dispatch:
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and verify tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Retrieve ORIGINAL pre-event GitHub artifact
        uses: actions/download-artifact@v4
        with:
          name: frozen-ufc-nov7-42296300043
          run-id: 42296300043
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/original_snapshot
      - name: Fetch outcomes as published in historical dataset
        run: |
          mkdir -p data
          curl -fsSL --retry 2 -o data/ufc_all_fights_wide.csv https://raw.githubusercontent.com/nlbair/ufc-data/main/data/ufc_all_fights_wide.csv
      - name: Score only completed, exactly matched bouts
        run: |
          python score_frozen.py \
            --frozen results/original_snapshot/frozen_predictions.csv \
            --manifest results/original_snapshot/manifest.json \
            --results data/ufc_all_fights_wide.csv \
            --out results/frozen_score.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/frozen_score.json").read_text())
          if result["completed_scored"] == 0:
              raise SystemExit("No decisive matched fights in current source; do not report a score yet.")
          print(f'Matched {result["completed_scored"]}/{result["total_frozen"]}; accuracy {result["accuracy"]}')
          PY
      - name: Publish evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufc-nov7-verified-scoring-${{ github.run_id }}
          path: results/frozen_score.json
          if-no-files-found: warn
          retention-days: 90
