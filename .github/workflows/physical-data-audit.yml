name: UFC physical data coverage audit
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/physical-data-audit.yml"
      - "physical_data_audit.py"
      - "tests/test_physical_data_audit.py"
      - "data_quality.py"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch cited public historical data
        run: |
          mkdir -p data
          curl -fsSL --retry 2 -o data/ufc_all_fights_wide.csv https://raw.githubusercontent.com/nlbair/ufc-data/main/data/ufc_all_fights_wide.csv
      - run: python physical_data_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-physical-coverage-${{ github.run_id }}
          path: results/physical_data_coverage.json
          if-no-files-found: error
          retention-days: 30
