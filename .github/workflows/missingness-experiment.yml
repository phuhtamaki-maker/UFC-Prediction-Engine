name: UFC paired-data quality experiment
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/missingness-experiment.yml"
      - "data_quality.py"
      - "missingness_experiment.py"
      - "engine.py"
      - "tests/test_data_quality.py"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies and unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Download public UFC historical research data
        run: |
          mkdir -p data
          curl -fsSL --retry 2 -o data/ufc_all_fights_wide.csv https://raw.githubusercontent.com/nlbair/ufc-data/main/data/ufc_all_fights_wide.csv
      - name: Evaluate missing-data handling chronologically
        run: python missingness_experiment.py
      - name: Save research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufc-pairwise-missingness-${{ github.run_id }}
          path: results/missingness_comparison.json
          if-no-files-found: warn
          retention-days: 30
